services:
  # Development database (npm run dev:*, db:migrate, db:seed)
  # Host ports follow DATABASE_PORT / DATABASE_PORT_TEST (shell or root .env), so a
  # local Postgres already on 5432 can be avoided, e.g. DATABASE_PORT=5434.
  postgres:
    image: postgres:17-alpine
    container_name: queue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue_dev
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test database for automated tests only (npm test). Same major version as dev.
  # Data lives in tmpfs: it is disposable and is recreated on every container start.
  postgres_test:
    image: postgres:17-alpine
    container_name: queue_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue_test
    ports:
      - "${DATABASE_PORT_TEST:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Full app in containers (Lab 5, C-03). Off by default so `npm run db:up` still
  # starts only the databases. Run from a fresh clone:
  #   cp .env.example .env
  #   docker compose --profile app up --build
  # Then open http://localhost:3000 (sign in with a seeded user and SEED_DEMO_PASSWORD).
  # The containers use the same images as Cloud Run; only the env differs.
  # ---------------------------------------------------------------------------

  # One-shot job: migrations + idempotent seed, from compiled JS (same as Cloud Run job).
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "db:prepare:prod"]
    environment: &api-db-env
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: queue
      DATABASE_PASSWORD: queue
      DATABASE_NAME: queue_dev
      DATABASE_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Default = the .env.example placeholder. A required (:?) variable here broke
      # `npm run db:up` on machines without .env, because Compose interpolates every service.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-change_me_local_demo_password}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-db-env
      PORT: "3001"
      COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
