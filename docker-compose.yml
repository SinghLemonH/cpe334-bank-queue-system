services:
  postgres:
    image: postgres:17-alpine
    container_name: queue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: